name: Windows ARM64 static Core terminal evidence

# One diagnostic observation, not a production context or release gate replacement.
on:
  push:
    branches: [fleet/416-static-core-terminal-evidence]

permissions:
  contents: read

jobs:
  static-core-terminal-evidence:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 100
    env:
      EXPECTED_SHA: ${{ github.event.after }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        timeout-minutes: 5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Create evidence logs and require direct b30 source
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path ".agent-scratch/static-core-terminal-evidence" | Out-Null
          python3 -B .github/scripts/static_core_terminal.py source
          if ($LASTEXITCODE -ne 0) { throw "Evidence source guard failed" }
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        timeout-minutes: 5
        with:
          repository: cataggar/azure-sdk-for-zig
          ref: 21b2bd41afa768fc2895041d8176fe06de9ccde6
          path: .sdk-httpx-conformance
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        timeout-minutes: 5
        with:
          repository: cataggar/zig-symcrypt
          ref: 9b3c94a2a4e0d98e055f0d908e11e1d7031b9a4b
          path: .zig-symcrypt-ci
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        timeout-minutes: 5
        with:
          repository: microsoft/SymCrypt
          ref: 286762b7730e2b780678f5ab11fef2b1bad639e0
          path: .symcrypt-ci-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        timeout-minutes: 5
        with:
          version: 0.16.0
      - name: Use unchanged verified x86-64 Zig under Windows ARM64 emulation
        timeout-minutes: 5
        shell: pwsh
        run: |
          $tools = "$env:GITHUB_WORKSPACE/.tools"
          $archive = "$tools/zig-x86_64-windows-0.16.0.zip"
          $directory = "$tools/zig-x86_64"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest `
            -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
          if ($actual -ne $expected) {
            throw "x86-64 Zig archive SHA-256 mismatch: found $actual, expected $expected"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          (Join-Path $directory "zig-x86_64-windows-0.16.0") |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check portable evidence regressions
        timeout-minutes: 2
        shell: pwsh
        run: |
          python3 -B -m unittest discover -s .github/scripts/tests
          if ($LASTEXITCODE -ne 0) { throw "Portable evidence regressions failed" }
      - name: Guard compiler identity and unchanged released inputs
        timeout-minutes: 10
        shell: pwsh
        run: |
          python3 -B .github/scripts/static_core_terminal.py preflight
          if ($LASTEXITCODE -ne 0) { throw "Preflight failed; no native diagnostic permitted" }
      - name: Build actual pinned Windows ARM64 SymCrypt fixtures
        timeout-minutes: 24
        shell: pwsh
        run: |
          python3 -B .github/scripts/static_core_terminal.py fixtures
          if ($LASTEXITCODE -ne 0) { throw "Fixture preparation failed" }
      - name: Compile NEW static ReleaseSafe Core artifact and record generated path
        timeout-minutes: 15
        shell: pwsh
        run: |
          python3 -B .github/scripts/static_core_terminal.py compile
          if ($LASTEXITCODE -ne 0) { throw "Core compile/receipt failed; no executable may be guessed" }
      - name: Observe all ten Core cases once without test-server IPC
        timeout-minutes: 7
        shell: pwsh
        run: |
          python3 -B .github/scripts/static_core_terminal.py terminal
          if ($LASTEXITCODE -ne 0) { throw "Standalone diagnostic failed; no qualification claim" }
      - name: State diagnostic scope regardless of outcome
        if: always()
        timeout-minutes: 1
        shell: pwsh
        run: |
          @"
          ## Static Core terminal evidence only
          This is a NEW diagnostic build receipt, not proof of the old b30 binary's bytes.
          The compiler-reported Core artifact runs once with the original seed/cwd/cache
          and without --listen=-. All ten explicit passes, zero skips and exit zero are
          required. Core execution has a 60-second whole-process limit (not the
          production response-watchdog semantics); observed owned-process cleanup has
          a separate 90-second bound. Logs are capped at 8 MiB per stream.
          Preflight is bounded to seven cumulative minutes, Core compilation to ten,
          native fixture construction to twenty, and the complete job to one hundred.
          No OpenSSL reference, TLS interop, post-loop examples/consumers, other
          configurations or full-matrix qualification are attempted or marked passed.
          A standalone pass would not prove an IPC-only cause, especially with a new
          artifact and without the original concurrent workload. Production policy
          and the missing Core10/post-loop release gates remain separate.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Preserve bounded receipts and logs, including failures
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-core-terminal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .agent-scratch/static-core-terminal-evidence/*.json
            .agent-scratch/static-core-terminal-evidence/*.jsonl
            .agent-scratch/static-core-terminal-evidence/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
