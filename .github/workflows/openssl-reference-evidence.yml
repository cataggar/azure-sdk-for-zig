# Registration entrypoint only; select the reviewed package evidence branch.
name: OpenSSL reference builder evidence

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed full evidence commit; select its branch, not main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openssl-reference-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-builder:
    name: openssl-reference-evidence (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            target: x86_64-linux-gnu
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            target: aarch64-linux-gnu
            arch: aarch64
          - runner: windows-2025
            platform: windows
            target: x86_64-windows-msvc
            arch: x86_64
          - runner: windows-11-vs2026-arm
            platform: windows
            target: aarch64-windows-msvc
            arch: aarch64
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Require a reviewed evidence branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "::error::Select the reviewed package evidence branch and its full expected_sha, not main."
            exit 1
          fi
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Check reviewed helper source and native runner
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_openssl_reference.py --target "${{ matrix.target }}"
      - name: Prepare existing Linux reference prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends perl make gcc
      - name: Execute unchanged Linux reference helper
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_openssl.py --target "${{ matrix.target }}"
      - name: Execute unchanged Windows reference helper
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./.github/scripts/prepare_openssl_windows.ps1 -Architecture "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL reference helper failed" }
      - name: Record actual native CLI evidence, not SDK qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_openssl_reference.py \
            --target "${{ matrix.target }}" --after-build
