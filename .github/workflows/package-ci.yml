name: azure_sdk_core_httpx CI

on:
  pull_request:
    branches: [sdk/core_httpx]
  push:
    branches: [sdk/core_httpx]

permissions:
  contents: read

jobs:
  package-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    name: package-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Check formatting
        shell: bash
        run: git ls-files -z -- '*.zig' 'build.zig.zon' | xargs -0 zig fmt --check
      # Requires the qualified paired HTTPX release pin. Never fall back to the
      # legacy-only suite; the public Azure HTTPS probe remains manual.
      - name: Run shared, paired standard TLS and trusted HTTPS tests
        shell: bash
        run: |
          status=0
          for mode in Debug ReleaseSafe; do
            zig build test -Dpaired-tls=true -Doptimize="$mode" -j2 --cache-dir .zig-cache/local --global-cache-dir .zig-cache/global --summary all || status=1
          done
          exit "$status"
